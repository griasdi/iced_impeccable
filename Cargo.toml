[package]
name = "iced_impeccable"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["Hannes Uebelacker <1265813+tuco86@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Headless remote control for iced applications: offscreen rendering, input injection, widget inventory and screenshots over a local socket"
repository = "https://github.com/tuco86/iced_impeccable"
homepage = "https://github.com/tuco86/iced_impeccable"
readme = "README.md"
keywords = ["iced", "gui", "headless", "testing", "automation"]
categories = ["gui", "development-tools::testing"]
# The crate ships the library, the binary, the demo, README, CHANGELOG and the
# licenses; the skill plugin, CI, repo tooling and README assets stay in git.
exclude = [
    "/plugin",
    "/.claude-plugin",
    "/.github",
    "/.githooks",
    "/assets",
    "/scripts",
    "/AGENTS.md",
    "/RELEASING.md",
    "/deny.toml",
]

[dependencies]
iced = { version = "0.14", features = ["advanced"] }
iced_runtime = "0.14"
iced_futures = "0.14"
iced_selector = "0.14"
png = "0.18"
font8x8 = "0.3"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
iced = { version = "0.14", features = ["advanced", "tokio"] }

[[bin]]
name = "iced-impeccable"
path = "src/bin/iced-impeccable.rs"

[[example]]
name = "demo"

[[example]]
name = "multiwin"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
