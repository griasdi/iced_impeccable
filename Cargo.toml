[package]
name = "iced_impeccable"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
authors = ["Hannes Uebelacker <1265813+tuco86@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Headless remote control for iced applications: offscreen rendering, input injection, widget inventory and screenshots over a local socket"
repository = "https://github.com/griasdi/iced_impeccable"
homepage = "https://github.com/griasdi/iced_impeccable"
readme = "README.md"
keywords = ["iced", "gui", "headless", "testing", "automation"]
categories = ["gui", "development-tools::testing"]
# The crate ships the library, the binary, the demo, README, CHANGELOG, the
# licenses and the skill files (the binary embeds them for `install`); the
# plugin and marketplace manifests, CI, repo tooling and README assets stay in
# git.
exclude = [
    "/plugin/.claude-plugin",
    "/.claude-plugin",
    "/.github",
    "/.githooks",
    "/assets",
    "/scripts",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/RELEASING.md",
    "/deny.toml",
]

[dependencies]
# `thread-pool`: iced does not compile without a futures executor.
iced = { version = "0.14", default-features = false, features = ["advanced", "thread-pool"] }
iced_runtime = "0.14"
iced_futures = "0.14"
iced_selector = "0.14"
png = "0.18"
font8x8 = "0.3"
serde_json = { version = "1", optional = true }

[features]
# The renderers are the app's choice: a library user that depends on this
# crate with `default-features = false` gets only the ones it names (and iced
# unifies them with the app's own). On Linux winit does not compile without
# `x11` or `wayland`.
default = ["wgpu", "tiny-skia", "cli", "x11", "wayland"]
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
x11 = ["iced/x11"]
wayland = ["iced/wayland"]
# `cli::install` (the skill installer, reads the agents' JSON) and the
# `iced-impeccable` binary.
cli = ["dep:serde_json"]

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
iced = { version = "0.14", features = ["advanced", "tokio"] }
serde_json = "1"

[[bin]]
name = "iced-impeccable"
path = "src/bin/iced-impeccable.rs"
required-features = ["cli"]

[[example]]
name = "demo"

[[example]]
name = "multiwin"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
